<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trợ lý Nghiên cứu AI</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: none;
      flex-wrap: wrap;
      gap: 6px 12px;
      padding: 10px 12px;
      background: #303033;
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      border-bottom: 1px solid #303033;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topbar a {
      color: #E6DEFF;
      text-decoration: none;
      font-size: 12px;
      padding: 4px 8px;
      border: 1px solid #55515F;
      background: #403C49;
      border-radius: 8px;
    }
    .topbar a:hover {
      background: #51475F;
    }
    .topbar a:focus-visible {
      outline: 2px solid #2563EB;
      outline-offset: 2px;
    }
    iframe {
      display: block;
      flex: 1;
      width: 100%;
      min-height: 0;
      border: none;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="56" height="56" rx="10" fill="#2563EB"/>
        <rect x="14" y="17" width="36" height="30" rx="5" fill="#FFFFFF"/>
        <rect x="19" y="23" width="26" height="12" rx="3" fill="#0F172A"/>
        <rect x="23" y="26.5" width="6" height="5" rx="1" fill="#38BDF8"/>
        <rect x="35" y="26.5" width="6" height="5" rx="1" fill="#38BDF8"/>
      </svg>
      <span>Trợ lý nghiên cứu</span>
    </div>
    <a href="http://localhost:8501" target="_blank" rel="noopener" title="Mở Studio trong tab mới">Mở Studio ↗</a>
  </div>
  <iframe
    src="http://localhost:8501/?embed=true&mode=sider"
    title="Trò chuyện với trợ lý nghiên cứu"
    allow="clipboard-read; clipboard-write"
  ></iframe>
</body>
</html>
